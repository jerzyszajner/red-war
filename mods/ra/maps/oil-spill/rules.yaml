World:
	LuaScript:
		Scripts: oil-spill.lua
	SpawnStartingUnits:
		DropdownVisible: False
		DropdownLocked: True
	StartingUnits@mcvonly:
		BaseActor: fcom

FCOM:
	MustBeDestroyed:
		RequiredForShortGame: true
	Power:
		Amount: 50
	Health:
		HP: 110000
	Production:
		Produces: Building, Defense
	RepairableBuilding:
		RepairStep: 700
		PlayerExperience: 5
		RepairingNotification: Repairing
	WithBuildingRepairDecoration:
		Image: allyrepair
		Sequence: repair
		Position: Center
		Palette: player
		IsPlayerPalette: True
	ProductionBar@Building:
		ProductionType: Building
	ProductionBar@Defense:
		ProductionType: Defense
		Color: 8A8A8A
	BaseBuilding:
	ProvidesPrerequisite@buildingname:

OILB:
	CashTrickler:
		Interval: 250
		Amount: 100
	SpawnActorOnDeath:
		Actor: OILB.Husk
		OwnerType: InternalName

OILB.Husk:
	Inherits: ^TechBuilding
	Inherits@shape: ^2x2Shape
	Selectable:
		Priority: 0
		Bounds: 2048, 2048
	CapturableProgressBar:
	CapturableProgressBlink:
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Tooltip:
		Name: actor-oilb-husk-name
	CaptureManager:
	Capturable:
		Types: building-husk
	TransformOnCapture:
		IntoActor: OILB
		ForceHealthPercentage: 50
	Targetable:
		TargetTypes: building-husk

